# First-party module manifest (manifest 1.0). Validates against
# spec/contracts/schemas/module-manifest.schema.json. Framework compatibility is >=0.3.0 <1.0.0.
manifest_version: "1.0"
module_id: northstar.knowledge
name: Northstar Knowledge
version: 0.3.0
description: >-
  Versioned, addressable, typed content: a canonical tree of typed blocks with stable block ids
  (LAW-06/ARCH-006), a draft -> review -> publication workflow with IMMUTABLE published revisions
  and provenance (LAW-07/ARCH-007), taxonomy, sanitized HTML/Markdown projections and
  object-storage-backed media behind a port (FR-CNT-001..007, FR-CNT-009). Capabilities run through
  the kernel buses (policy-checked, audited) and publication emits a transactional-outbox event.
owner: Content Architecture Council
maturity: experimental
framework_compatibility:
  minimum: 0.3.0
  maximum_exclusive: 1.0.0
  contract_api: 0.3.0
dependencies: []
capabilities:
  - knowledge.document.create
  - knowledge.draft.edit
  - knowledge.document.submit
  - knowledge.document.publish
  - knowledge.document.get
  - knowledge.revision.get
  - knowledge.taxonomy.assign
  - knowledge.document.browse
  - knowledge.taxonomy.terms
produced_events:
  - northstar.knowledge.document-published.v1
data_ownership:
  postgres_schemas:
    - northstar_knowledge
  object_prefixes:
    - knowledge/
  classifications:
    - public
    - internal
    - confidential
lifecycle:
  migrations: true
  health_checks:
    - migration_compatibility
  uninstall_policy: export_then_delete
