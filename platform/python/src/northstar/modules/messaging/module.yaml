# First-party module manifest (manifest 1.0). Validates against
# spec/contracts/schemas/module-manifest.schema.json. Framework compatibility is >=0.3.0 <1.0.0.
manifest_version: "1.0"
module_id: northstar.messaging
name: Northstar Messaging
version: 0.3.0
description: >-
  Provider-neutral messaging, campaigns and templates (docs/16, FR-MSG-001..007): transactional vs
  marketing classification that decides whether suppression applies (FR-MSG-001); versioned,
  IMMUTABLE templates with deterministic rendering (FR-MSG-002); audience segmentation over APPROVED
  attributes only, never arbitrary query/DB access (FR-MSG-003); recipient-time-zone scheduling
  (FR-MSG-004); consent + suppression that is ALWAYS honoured so a suppressed/unsubscribed/
  non-consented recipient is NEVER in a marketing send (FR-MSG-005); idempotent provider submission
  behind a port so a re-submitted (campaign, recipient, key) never double-sends (FR-MSG-006); and
  per-campaign open/click tracking that is privacy-safe (off) by default (FR-MSG-007). Capabilities
  run through the kernel command bus (policy-checked, audited).
owner: Messaging Council
maturity: experimental
framework_compatibility:
  minimum: 0.3.0
  maximum_exclusive: 1.0.0
  contract_api: 0.3.0
dependencies: []
capabilities:
  - template.publish
  - campaign.create
  - campaign.schedule
  - campaign.send
  - consent.unsubscribe
produced_events: []
data_ownership:
  postgres_schemas:
    - northstar_messaging
  classifications:
    - internal
    - confidential
lifecycle:
  migrations: true
  health_checks:
    - migration_compatibility
  uninstall_policy: export_then_delete
