# First-party module manifest (manifest 1.0). Validates against
# spec/contracts/schemas/module-manifest.schema.json. Framework compatibility is >=0.3.0 <1.0.0.
manifest_version: "1.0"
module_id: northstar.simulation
name: Northstar Simulation Control and Runtime Adapter
version: 0.3.0
description: >-
  Simulation control plane + one reference in-process sandbox runtime (docs/15): versioned,
  schema-valid definitions IMMUTABLE once published (FR-SIM-001); runtime trust tiers behind
  adapters a definition can never downgrade (FR-SIM-002/008); deny-by-default runtime policy with an
  explicit egress allowlist (SSRF defence) and enforced CPU/memory/time/step quotas (FR-SIM-003);
  short-lived HMAC-signed leases validated without broad app credentials (FR-SIM-004); a sandbox
  that cannot read secrets, escape or reach non-allowlisted egress (EVAL-SEC-010); immutable
  hash-chained tamper-evident run evidence (FR-SIM-005); deterministic replayable scoring
  (FR-SIM-006); and AI coaching that reuses ai.answer as a SCOPED actor which cannot see hidden
  scoring keys (FR-SIM-007, scoring_key_disclosure_rate == 0, closing GATE-AI-GA's last blocker).
owner: Simulation Council
maturity: experimental
framework_compatibility:
  minimum: 0.3.0
  maximum_exclusive: 1.0.0
  contract_api: 0.3.0
dependencies:
  - module_id: northstar.ai
    version_range: ">=0.3.0 <1.0.0"
capabilities:
  - simulation.definition.define
  - simulation.definition.publish
  - simulation.lease.issue
  - simulation.run.execute
  - simulation.run.coach
  - simulation.trust-tier.set
data_ownership:
  postgres_schemas:
    - northstar_simulation
  classifications:
    - public
    - internal
    - confidential
    - restricted
lifecycle:
  migrations: true
  health_checks:
    - migration_compatibility
  uninstall_policy: export_then_delete
