# First-party module manifest (manifest 1.0). Validates against
# spec/contracts/schemas/module-manifest.schema.json. Framework compatibility is >=0.3.0 <1.0.0.
manifest_version: "1.0"
module_id: northstar.support
name: Northstar Support
version: 0.3.0
description: >-
  Support: governed contact/support cases (docs/29 §6, FR-SUP-001..003). Intake VALIDATES input and
  rejects malformed/oversized/injection-shaped submissions before a case exists (FR-SUP-001); cases
  carry ownership + a governed lifecycle with only allowed status transitions (FR-SUP-002). Support
  staff see a MINIMIZED projection by default (no requester PII, no internal notes); any elevated/broad
  read requires an audited, deny-by-default, TIME-BOUNDED support-access grant — an unauthorized broad
  read is refused and logged (FR-SUP-003). Capabilities run through the kernel command/query buses
  (policy-checked, audited); internal notes are separated from requester-visible messages.
owner: Support Council
maturity: experimental
framework_compatibility:
  minimum: 0.3.0
  maximum_exclusive: 1.0.0
  contract_api: 0.3.0
dependencies: []
capabilities:
  - support.intake
  - support.case.assign
  - support.case.transition
  - support.case.reply
  - support.case.view
  - support.access.grant
  - support.access.revoke
produced_events: []
data_ownership:
  postgres_schemas:
    - northstar_support
  classifications:
    - internal
    - confidential
    - restricted
lifecycle:
  migrations: true
  health_checks:
    - migration_compatibility
  uninstall_policy: export_then_delete
